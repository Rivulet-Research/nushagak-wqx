name: Render and Publish Book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install R dependencies
        run: |
          install.packages(c('dataRetrieval', 'dplyr', 'ggplot2'))
        shell: Rscript {0}

      - name: Render book (HTML)
        run: quarto render --to html

      - name: Render book (DOCX)
        run: quarto render --to docx

      - name: Move docx to HTML output
        run: |
          mv _book/nushagak-wqx.docx _book/ 2>/dev/null || true
          ls -la _book/

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: '_book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

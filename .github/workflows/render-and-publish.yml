name: Render and Publish Book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install R dependencies
        run: |
          install.packages(c('dataRetrieval', 'dplyr', 'ggplot2'))
        shell: Rscript {0}

      - name: Render book (HTML)
        run: quarto render --to html

      - name: Render book (DOCX)
        run: quarto render --to docx

      - name: Commit and push docs/ to main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/
          git commit -m "Auto-render book on $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push origin main

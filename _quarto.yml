project:
  type: book
  output-dir: _book

book:
  title: "Nushagak River Watershed Water Quality Baseline"
  subtitle: "Synthesis of Existing Data in Support of Collaborative Monitoring"
  author: "Benjamin Meyer, Prepared for Tributary Research and Consulting"
  date: "October 2026"
  sidebar:
    tools:
      - icon: cloud-download
        href: Nushagak-River-Watershed-Water-Quality-Baseline.docx
        text: "Download DOCX"
      - icon: github
        href: "https://github.com/Rivulet-Research/nushagak-wqx"
        text: "GitHub Repository"
  chapters:
    - index.qmd
    - part: "Part I: Watershed Context & Existing Baseline"
      chapters:
        - chapters/01_intro.qmd
        - chapters/02_data_sources.qmd
        - chapters/03_spatial_coverage.qmd
        - chapters/04_parameters_summary.qmd
    - part: "Part II: Baseline Water Quality Synthesis"
      chapters:
        - chapters/05_physical_chemical.qmd
        - chapters/06_metals_contaminants.qmd
        - chapters/07_nutrients_salmon.qmd
        - chapters/08_gaps_and_needs.qmd
    - part: "Part III: RFP Context & Monitoring Strategy"
      chapters:
        - chapters/09_community_focus.qmd
        - chapters/10_monitoring_design.qmd
        - chapters/11_data_management.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    number-sections: false
    embed-resources: false
  docx:
    number-sections: true
    toc: true
    toc-depth: 2
    prefer-html: true
  pdf:
    documentclass: scrbook
